name: Build LangGraph image

on:
  push:
    branches: [ "master" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1


      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v2.2.4'


      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}


      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  # Dokploy hosts the production compose stack. Once the new image is
  # published and signed, hitting the deploy webhook redeploys it.
  # Dokploy expects a GitHub-style push payload: without the X-GitHub-Event
  # header and a matching ref it rejects the call with "Branch Not Match",
  # so the payload is fixed to the branch configured in the compose (master).
  deploy:
    name: Trigger production deploy (Dokploy webhook)
    needs: build-and-push
    runs-on: ubuntu-latest
    # Runs inside the repository's "Production" environment, so environment
    # secrets and protection rules apply on top of the repo-level ones.
    environment: Production
    # The Production environment's deployment branch policy only admits
    # master, so release tags publish the image but skip this job instead of
    # failing the run. To let tags deploy too, add a matching rule to the
    # environment's deployment policy and remove this gate.
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Dokploy compose deploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "${DOKPLOY_DEPLOY_WEBHOOK:-}" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK is not set; skipping deploy trigger."
            exit 0
          fi
          # Fail on ANY non-200: Dokploy answers 404 (unknown token), 400
          # (deployments disabled) and 301 (branch / watch paths not matched)
          # without deploying, and curl --fail would wrongly treat the 3xx
          # family as success. Capture the body so logs show why.
          status=$(curl -sS --max-time 60 --retry 3 --retry-delay 5 \
            -o /tmp/webhook-body.txt -w '%{http_code}' \
            -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/master","repository":{"full_name":"yokharian/Vehicle-Sales-Agent"}}')
          body=$(head -c 300 /tmp/webhook-body.txt)
          echo "Dokploy webhook responded with HTTP ${status}: ${body}"
          if [ "$status" != "200" ]; then
            echo "::error::Dokploy webhook returned HTTP ${status}; deployment was not triggered."
            exit 1
          fi