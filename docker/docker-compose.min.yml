# Minimal self-hosted deployment - WEB.
services:
  langgraph-api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "2024:8000"
    env_file:
      - ../.env
    environment:
      # in-memory runtime
      - LANGGRAPH_RUNTIME_EDITION=inmem
      # LangGraph run queue (fakeredis)
      - REDIS_URI=fake

      # Vehicle catalog in-memory sqlite
      - "POSTGRES_URI="
      - "PGVECTOR_URI=postgresql://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable"

      # Agent chat model
      - MODEL_PROVIDER=${MODEL_PROVIDER:-openrouter}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-5.6-luna}

      # Document search embeddings
      - DOCUMENT_EMBEDDING_PROVIDER=${DOCUMENT_EMBEDDING_PROVIDER:-openrouter}
      - DOCUMENT_EMBEDDING_MODEL=${DOCUMENT_EMBEDDING_MODEL:-openai/text-embedding-3-small}

      # NOTE: API keys (OPENAI_API_KEY, OPENROUTER_API_KEY, DOCUMENT_*_API_KEY,
      # TWILIO_*, LANGFUSE_*, LANGSMITH_API_KEY — needed by the langgraph-api
      # license check —, SUPABASE_URL) are delivered unshadowed by
      # env_file ../.env — interpolating them here yields empty strings that
      # override the real values.

      # Optional Langfuse Tracing
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
      - LANGFUSE_TRACING_ENVIRONMENT=${LANGFUSE_TRACING_ENVIRONMENT}

      # Optional Supabase JWT auth (unset = server runs open)
      - SUPABASE_URL=${SUPABASE_URL}
    volumes:
      - ../data:/deps/vehicle-sales-agent/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/api/healthcheck.py"]
      interval: 10s
      timeout: 10s
      retries: 5

  langgraph-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langgraph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langgraph"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
